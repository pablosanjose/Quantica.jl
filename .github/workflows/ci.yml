name: CI
on:
  push:
    branches:
      - master
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only for pull requests (never for master or tags).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} (${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    permissions: # needed to allow julia-actions/cache to delete old caches it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      # All OSes on the current release; lts on Linux and macOS (many users), pre on Linux only.
      # The Makie stack (test_plots) is tested in a single "plots" job: Makie has hundreds of
      # dependencies, so it gets recompiled whenever any of them is updated. The "main" jobs
      # never load or compile it. Fewer jobs and smaller caches also keep the per-job
      # julia-actions/cache entries within GitHub's 10 GB repository cache limit.
      matrix:
        include:
          - { version: '1',   os: ubuntu-latest,  group: main }
          - { version: '1',   os: windows-latest, group: main }
          - { version: '1',   os: macOS-latest,   group: main }
          - { version: 'lts', os: ubuntu-latest,  group: main }
          - { version: 'lts', os: macOS-latest,   group: main }
          - { version: 'pre', os: ubuntu-latest,  group: main }
          - { version: '1',   os: ubuntu-latest,  group: plots }
    env:
      QUANTICA_TEST_GROUP: ${{ matrix.group }}       # read by test/runtests.jl
      # Precompile packages only when loaded, so "main" jobs never compile the Makie stack
      JULIA_PKG_PRECOMPILE_AUTO: ${{ matrix.group == 'plots' && '1' || '0' }}
    steps:
      - name: Memory diagnostics at start (TEMPORARY)
        if: runner.os == 'macOS'
        run: sysctl hw.memsize hw.ncpu; vm_stat; ps -axm -o rss=,comm= | head -12
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "true"
          # don't save caches from failed or cancelled jobs, which may hold an incomplete
          # (half-precompiled) depot that the next run would restore
          save-always: "false"
      - uses: julia-actions/julia-buildpkg@v1
      - name: Memory diagnostics before tests (TEMPORARY)
        if: runner.os == 'macOS'
        run: vm_stat; ps -axm -o rss=,comm= | head -12
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      actions: write   # julia-actions/cache cleanup
      contents: write  # push to gh-pages
      statuses: write  # Documenter deployment status
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
        with:
          cache-compiled: "true"
      - name: Install docs dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
